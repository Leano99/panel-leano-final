<!doctype html><html><head><meta charset="utf-8"><title>Follow + Gift Notifications</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}
*{box-sizing:border-box}
#eventFx{position:fixed;inset:0;pointer-events:none;z-index:50}
#eventFx.pos-top-center{display:flex;align-items:flex-start;justify-content:center;padding-top:70px}
#eventFx.pos-center{display:flex;align-items:center;justify-content:center}
#eventFx.pos-bottom-center{display:flex;align-items:flex-end;justify-content:center;padding-bottom:110px}
.fx-card{position:relative;min-width:390px;max-width:min(680px,80vw);padding:14px 24px;border-radius:22px;display:flex;align-items:center;gap:16px;color:#fff;overflow:hidden;transform:translateY(-18px) scale(.88);opacity:0;box-shadow:0 16px 60px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);will-change:transform,opacity,filter,box-shadow}
.fx-card.enter{animation:fxEnter .62s cubic-bezier(.16,1,.3,1) forwards}
.fx-card.leave{animation:fxLeave .95s cubic-bezier(.22,1,.36,1) forwards}
.fx-avatar{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:28px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.7);box-shadow:0 0 24px rgba(255,255,255,.25)}
.fx-text{min-width:0;text-align:left}.fx-kicker{font:800 11px Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;opacity:.9}.fx-user{font:900 22px 'Space Grotesk',Inter,sans-serif;margin-top:2px;text-shadow:0 3px 14px rgba(0,0,0,.35)}.fx-sub{font:700 13px Inter,sans-serif;opacity:.95;margin-top:3px}
.fx-particle{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 16px currentColor;opacity:.9;animation:particle 1.8s ease-in-out infinite}.fx-particle.p1{left:8%;top:20%;color:#25d9ff}.fx-particle.p2{left:23%;bottom:15%;color:#ff4fb3;animation-delay:.25s}.fx-particle.p3{right:17%;top:16%;color:#ffd44d;animation-delay:.5s}.fx-particle.p4{right:6%;bottom:22%;color:#8b6bf2;animation-delay:.8s}
.fx-wings{background:linear-gradient(110deg,#0c1535,#322067 48%,#071c3d);border-color:#25d9ff}.fx-wings::before{content:'✦  ♡  ✦';position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;font-size:34px;color:#25d9ff;opacity:.16}.fx-neon{background:linear-gradient(110deg,#090b18,#5b0b4f,#101c56);border-color:#ff3da8;box-shadow:0 0 45px rgba(255,61,168,.28),0 16px 60px rgba(0,0,0,.45)}.fx-neon .fx-avatar{border-color:#ff3da8;box-shadow:0 0 28px rgba(37,217,255,.65)}.fx-cat{background:linear-gradient(110deg,#071d38,#0e4d67,#172046);border-color:#25d9ff}.fx-cat::after{content:'♫  ♥  ♪';position:absolute;right:18px;top:8px;color:#25d9ff;opacity:.7;font-size:18px}.fx-treasure{background:linear-gradient(110deg,#4d2400,#b86d05 45%,#512100);border-color:#ffd44d;box-shadow:0 0 48px rgba(255,192,51,.32),0 16px 60px rgba(0,0,0,.45)}.fx-treasure .fx-avatar{border-color:#ffd44d}.fx-rose{background:linear-gradient(110deg,#4d071d,#c41f62 48%,#5a0a38);border-color:#ff76b7;box-shadow:0 0 48px rgba(255,77,165,.3),0 16px 60px rgba(0,0,0,.45)}.fx-universe{background:radial-gradient(circle at 80% 50%,#5c32d8,#151044 42%,#050718 85%);border-color:#9b8cff;box-shadow:0 0 52px rgba(139,107,242,.36),0 16px 60px rgba(0,0,0,.45)}
@keyframes fxEnter{0%{opacity:0;transform:translateY(-28px) scale(.82);filter:blur(3px)}65%{opacity:1;transform:translateY(4px) scale(1.025);filter:blur(0)}82%{transform:translateY(-1px) scale(1.008)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes fxLeave{0%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);box-shadow:0 16px 60px rgba(0,0,0,.45)}55%{opacity:.78;transform:translateY(-3px) scale(.995);filter:blur(.25px);box-shadow:0 10px 40px rgba(0,0,0,.30)}100%{opacity:0;transform:translateY(-12px) scale(.985);filter:blur(1.5px);box-shadow:0 4px 18px rgba(0,0,0,0)}}@keyframes particle{0%,100%{transform:translateY(0) scale(.7);opacity:.25}50%{transform:translateY(-16px) scale(1.2);opacity:1}}
</style></head><body><div id="eventFx" class="pos-top-center"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const eventFx=document.getElementById('eventFx');
let settings={enabled:true,followStyle:'wings',giftStyle:'treasure',followDuration:4,giftDuration:5,position:'top-center'};
socket.on('overlay:settings',s=>{settings={...settings,...(s?.animations||{})};});
socket.on('event',p=>{if(p&&p.kind==='alert'&&(p.type==='follow'||p.type==='gift')&&settings.enabled)show(p);});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show({type,username,extra}){eventFx.className='pos-'+(settings.position||'top-center');const style=type==='follow'?(settings.followStyle||'wings'):(settings.giftStyle||'treasure');const duration=Math.max(2,Math.min(10,Number(type==='follow'?settings.followDuration:settings.giftDuration)||4));const card=document.createElement('div');card.className='fx-card fx-'+style;const icon=type==='follow'?'✦':style==='rose'?'🌹':style==='universe'?'🌌':'🎁';const kicker=type==='follow'?'NEW FOLLOWER':'GIFT MASUK';const sub=extra|| (type==='follow'?'Baru saja follow!':'mengirim gift!');card.innerHTML='<span class="fx-particle p1"></span><span class="fx-particle p2"></span><span class="fx-particle p3"></span><span class="fx-particle p4"></span><div class="fx-avatar">'+icon+'</div><div class="fx-text"><div class="fx-kicker">'+kicker+'</div><div class="fx-user">@'+esc(username||'Penonton')+'</div><div class="fx-sub">'+esc(sub)+'</div></div>';eventFx.appendChild(card);requestAnimationFrame(()=>card.classList.add('enter'));const leaveMs=950;setTimeout(()=>{card.classList.remove('enter');void card.offsetWidth;card.classList.add('leave');setTimeout(()=>card.remove(),leaveMs+60)},Math.max(1200,duration*1000-leaveMs));}
</script></body></html>
